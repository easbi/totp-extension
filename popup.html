<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>TOTP Authenticator</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- Layar Input PIN Lock -->
  <div id="lock-screen" class="pin-screen" style="display: none;">
    <h2>TOTP Easy Authenticator </h2>
    <p id="pin-msg" style="font-size: 12px; color: #666; margin: 0;">Masukkan PIN Anda:</p>
    <input type="password" id="pin-field" class="pin-input" maxlength="8" placeholder="****">
    <button id="btn-unlock">Buka Akses</button>
  </div>

  <!-- Layar Utama Ekstensi -->
  <div id="main-screen" class="container" style="display: none;">
    <h2>Authenticator</h2>
    <div id="token-list"></div>
    
    <div class="actions">
      <button id="btn-add">Tambah Manual</button>
      <button id="btn-import">Import Google Auth</button>
      <button id="btn-export">Export JSON</button>
    </div>
  </div>

  <input type="file" id="import-file" style="display: none;" accept=".json">

  <script src="lib/base32.js"></script>
  <script src="lib/jsotp.min.js"></script>
  <script src="lib/google-auth-parser.js"></script>
  <script src="popup.js"></script>
</body>
</html>
