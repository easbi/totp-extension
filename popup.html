<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>TOTP Authenticator</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>

  <!-- LAYER 1: PIN / LOCK SCREEN -->
  <div id="pin-screen">
    <h2>🔒 TOTP Authenticator</h2>
    <p id="pin-instruction">Masukkan PIN untuk membuka:</p>
    <input type="password" id="pin-input" maxlength="8" placeholder="Masukkan PIN">
    <button id="btn-unlock">Buka Akses</button>
  </div>

  <!-- LAYER 2: LAYAR UTAMA (SETELAH UNLOCK) -->
  <div id="main-screen" class="container hidden">
    
    <!-- HEADER LAYAR UTAMA -->
    <div class="header">
      <h2>🔑 Kode TOTP</h2>
      <button id="btn-lock-now" class="btn-icon">🔒 Kunci</button>
    </div>

    <!-- BARIS PENGATURAN DURASI KUNCI OTOMATIS -->
    <div class="settings-bar">
      <label for="select-timeout">Kunci Otomatis:</label>
      <select id="select-timeout">
        <option value="0">Setiap Dibuka (Selalu Minta PIN)</option>
        <option value="1">1 Menit</option>
        <option value="5">5 Menit</option>
        <option value="10">10 Menit</option>
        <option value="60">1 Jam</option>
      </select>
    </div>

    <!-- CONTAINER DAFTAR AKUN TOTP -->
    <div id="token-list"></div>

    <!-- TOMBOL AKSI UTAMA -->
    <div class="action-buttons">
      <button id="btn-add">➕ Tambah Manual</button>
      <button id="btn-import">📥 Import Data</button>
      <button id="btn-export">📤 Export JSON</button>
    </div>
    
    <!-- ELEMENT FILE INPUT TERSEMBUNYI UNTUK IMPORT JSON -->
    <input type="file" id="import-file" accept=".json" style="display: none;">
  </div>

  <!-- SCRIPT LIBRARIES & LOGIC -->
  <script src="lib/base32.js"></script>
  <script src="lib/jsotp.min.js"></script>
  <script src="lib/google-auth-parser.js"></script>
  <script src="popup.js"></script>
</body>
</html>
